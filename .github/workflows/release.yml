name: Release Windows Build

# Dispara ao empurrar uma tag de versao (ex.: git tag v1.0.0 && git push origin v1.0.0).
# Gera o executavel Windows via PyInstaller e publica como GitHub Release,
# disponivel gratuitamente para download por qualquer pessoa.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Write production .env
        shell: bash
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          APP_KEYRING_SERVICE=HubiTime
          APP_LOG_LEVEL=INFO
          EOF

      - name: Build executable
        run: pyinstaller --noconfirm --windowed --name "HubiTime" --add-data ".env;." main.py

      - name: Zip build output
        shell: pwsh
        run: Compress-Archive -Path dist/HubiTime/* -DestinationPath HubiTime-${{ github.ref_name }}-windows.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: HubiTime-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
